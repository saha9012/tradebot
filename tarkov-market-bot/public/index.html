<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Market Bot</title>
</head>
<body>
    <h1>Привет, я бот!</h1>
    <button onclick="ping()">Проверить API</button>
    <p id="result"></p>

    <script>
        async function ping() {
            let res = await fetch('/api/ping');
            let data = await res.json();
            document.getElementById('result').innerText = data.message;
        }
    </script>
</body>
</html>
